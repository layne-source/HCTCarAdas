plugins {
    id "com.android.application"
}

android {
    namespace "com.hct.adas"
    compileSdk 36

    defaultConfig {
        applicationId "com.hct.adas"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The existing UVC AAR is copied locally for later frame-source integration.
    implementation files("libs/libusbcamera.aar")
}
