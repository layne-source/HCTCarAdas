plugins {
    id "com.android.application"
}

android {
    namespace "com.hct.adas"
    compileSdk 36

    defaultConfig {
        applicationId "com.hct.adas"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        ndk {
            // These are the ABIs provided by the existing UVC AAR.
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.configureEach {
                outputFileName = "HCTCarAdas.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += "tflite"
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // The existing UVC AAR is copied locally for later frame-source integration.
    implementation files("libs/libusbcamera.aar")
    implementation "com.google.ai.edge.litert:litert:1.4.1"
    testImplementation "junit:junit:4.13.2"
}
